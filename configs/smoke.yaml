data:
  train: data/squat_train.pt
  val: data/squat_val.pt
  target_len: 32
  modality_dropout: 0.2
  augment: true

model:
  d_model: 64
  nhead: 4
  num_layers: 1
  dropout: 0.2

train:
  epochs: 2
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 0
  output_dir: runs/smoke
  seed: 42

