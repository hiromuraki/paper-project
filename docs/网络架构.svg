<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .boxTitle { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .boxText { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; }
      .small { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #64748b; }
      .scope { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #7c3aed; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .flowBlue { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .flowGreen { fill: none; stroke: #16a34a; stroke-width: 2.2; marker-end: url(#arrowGreen); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1200" fill="#ffffff"/>

  <text x="900" y="48" text-anchor="middle" class="title">
    Reference-Conditioned 2D/3D Skeleton Comparison Network
  </text>
  <text x="900" y="78" text-anchor="middle" class="subtitle">
    输入：参考骨骼 R 与测试骨骼 X 的 2D/3D H36M 序列；2D 高可信，3D 次可信；输出：相似度 + 多维差异
  </text>

  <!-- External scope -->
  <rect x="40" y="100" width="1720" height="78" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="64" y="130" class="scope">External（不属于本模型）</text>
  <text x="64" y="156" class="boxText">
    姿态估计、跟踪、平滑、拓扑映射、相机标定；外部提供 H36M 17 关节 2D（高可信）与 3D（次可信）骨骼。
  </text>
  <path d="M900,178 L900,205" class="dash" marker-end="url(#arrow)"/>
  <text x="915" y="198" class="small">assumed exact input</text>

  <!-- Main model boundary -->
  <rect x="40" y="215" width="1720" height="855" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="12 8"/>
  <text x="64" y="248" class="scope">This model（本模型的理论范围）</text>

  <!-- Inputs -->
  <rect x="80" y="285" width="210" height="135" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="316" text-anchor="middle" class="boxTitle">Reference R</text>
  <text x="185" y="344" text-anchor="middle" class="boxText">R_2D: [Tr, 17, 2]</text>
  <text x="185" y="368" text-anchor="middle" class="boxText">R_3D: [Tr, 17, 3]</text>
  <text x="185" y="396" text-anchor="middle" class="small">H36M 17，无置信度</text>

  <rect x="80" y="705" width="210" height="135" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="185" y="736" text-anchor="middle" class="boxTitle">Test X</text>
  <text x="185" y="764" text-anchor="middle" class="boxText">X_2D: [Tt, 17, 2]</text>
  <text x="185" y="788" text-anchor="middle" class="boxText">X_3D: [Tt, 17, 3]</text>
  <text x="185" y="816" text-anchor="middle" class="small">H36M 17，无置信度</text>

  <!-- Encoders -->
  <rect x="360" y="275" width="245" height="155" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="482" y="306" text-anchor="middle" class="boxTitle">Dual-modality Encoder</text>
  <text x="482" y="334" text-anchor="middle" class="boxText">2D proj + 3D proj</text>
  <text x="482" y="358" text-anchor="middle" class="boxText">Spatial-Temporal</text>
  <text x="482" y="382" text-anchor="middle" class="boxText">Transformer / GCN</text>
  <text x="482" y="408" text-anchor="middle" class="small">坐标 + 骨向量 + 角度 + 速度</text>

  <rect x="360" y="695" width="245" height="155" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="482" y="726" text-anchor="middle" class="boxTitle">Dual-modality Encoder</text>
  <text x="482" y="754" text-anchor="middle" class="boxText">2D proj + 3D proj</text>
  <text x="482" y="778" text-anchor="middle" class="boxText">Spatial-Temporal</text>
  <text x="482" y="802" text-anchor="middle" class="boxText">Transformer / GCN</text>
  <text x="482" y="828" text-anchor="middle" class="small">坐标 + 骨向量 + 角度 + 速度</text>

  <path d="M482,430 L482,695" class="dash"/>
  <text x="500" y="565" class="small">shared / partially shared weights</text>

  <!-- Fusion -->
  <rect x="665" y="285" width="220" height="135" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="775" y="316" text-anchor="middle" class="boxTitle">Cross-Modal Fusion</text>
  <text x="775" y="344" text-anchor="middle" class="boxText">reliability-aware fusion</text>
  <text x="775" y="368" text-anchor="middle" class="boxText">2D high-trust / 3D secondary</text>
  <text x="775" y="396" text-anchor="middle" class="small">α = σ(reliability head)</text>

  <rect x="665" y="705" width="220" height="135" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="775" y="736" text-anchor="middle" class="boxTitle">Cross-Modal Fusion</text>
  <text x="775" y="764" text-anchor="middle" class="boxText">reliability-aware fusion</text>
  <text x="775" y="788" text-anchor="middle" class="boxText">2D high-trust / 3D secondary</text>
  <text x="775" y="816" text-anchor="middle" class="small">α = σ(reliability head)</text>

  <!-- H_R / H_X -->
  <rect x="940" y="310" width="165" height="85" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="1022" y="342" text-anchor="middle" class="boxTitle">H_R</text>
  <text x="1022" y="370" text-anchor="middle" class="boxText">[Tr, 17, d]</text>

  <rect x="940" y="725" width="165" height="85" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="1022" y="757" text-anchor="middle" class="boxTitle">H_X</text>
  <text x="1022" y="785" text-anchor="middle" class="boxText">[Tt, 17, d]</text>

  <!-- Alignment -->
  <rect x="1170" y="455" width="255" height="175" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="1297" y="487" text-anchor="middle" class="boxTitle">Monotonic Alignment</text>
  <text x="1297" y="516" text-anchor="middle" class="boxText">soft-DTW / monotonic</text>
  <text x="1297" y="540" text-anchor="middle" class="boxText">cross-attention</text>
  <text x="1297" y="568" text-anchor="middle" class="boxText">→ A, H_R^align</text>
  <text x="1297" y="598" text-anchor="middle" class="small">在线推理时使用 causal mask</text>

  <!-- Pair representation -->
  <rect x="1490" y="445" width="245" height="195" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text x="1612" y="477" text-anchor="middle" class="boxTitle">Pair Representation C</text>
  <text x="1612" y="506" text-anchor="middle" class="boxText">[ H_X, H_R^align,</text>
  <text x="1612" y="530" text-anchor="middle" class="boxText">H_X - H_R^align, |·|, ⊙ ]</text>
  <text x="1612" y="558" text-anchor="middle" class="boxText">+ geometry</text>
  <text x="1612" y="584" text-anchor="middle" class="small">angle / velocity / distance</text>
  <text x="1612" y="606" text-anchor="middle" class="small">symmetry / phase</text>

  <!-- Heads -->
  <rect x="1490" y="700" width="245" height="105" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="1612" y="733" text-anchor="middle" class="boxTitle">Similarity Head</text>
  <text x="1612" y="762" text-anchor="middle" class="boxText">s ∈ [0, 1]</text>
  <text x="1612" y="787" text-anchor="middle" class="small">可输出分布 / 不确定性</text>

  <rect x="1490" y="845" width="245" height="145" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1612" y="877" text-anchor="middle" class="boxTitle">Dimension Heads</text>
  <text x="1612" y="906" text-anchor="middle" class="boxText">K learnable queries</text>
  <text x="1612" y="931" text-anchor="middle" class="boxText">Δ_k, score_k</text>
  <text x="1612" y="956" text-anchor="middle" class="boxText">direction_k, uncertainty_k</text>

  <!-- Downstream -->
  <rect x="80" y="1000" width="1320" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="104" y="1028" class="scope">Downstream（不属于本模型）</text>
  <text x="104" y="1052" class="boxText">
    维度差异 → 骨骼/关节高亮；动作专用小模型 → 错误码 + 提示语。
  </text>

  <!-- Losses -->
  <rect x="430" y="860" width="930" height="82" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="895" y="893" text-anchor="middle" class="boxTitle">Training Objective</text>
  <text x="895" y="922" text-anchor="middle" class="boxText">
    L = L_sim + λ₁ L_align + λ₂ L_dim + λ₃ L_consistency + λ₄ L_cal
  </text>

  <!-- Arrows: inputs to encoders -->
  <path d="M290,355 L360,355" class="flow"/>
  <path d="M290,770 L360,770" class="flow"/>

  <!-- Arrows: encoders to fusion -->
  <path d="M605,355 L665,355" class="flow"/>
  <path d="M605,770 L665,770" class="flow"/>

  <!-- Arrows: fusion to H -->
  <path d="M885,355 L940,355" class="flow"/>
  <path d="M885,770 L940,770" class="flow"/>

  <!-- Arrows: H to alignment -->
  <path d="M1105,352 H1135 V505 H1170" class="flow"/>
  <path d="M1105,768 H1135 V585 H1170" class="flow"/>

  <!-- Arrow: alignment to pair -->
  <path d="M1425,542 H1490" class="flow"/>

  <!-- Arrows: pair to heads -->
  <path d="M1612,640 L1612,700" class="flow"/>
  <path d="M1540,640 V670 H1440 V918 H1490" class="flowGreen"/>

  <!-- Arrow: dimension head to downstream -->
  <path d="M1490,918 H1420 V1031 H1400" class="flowGreen"/>

  <!-- Legend -->
  <text x="80" y="1120" class="boxTitle">Legend</text>
  <line x1="170" y1="1115" x2="230" y2="1115" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="240" y="1120" class="boxText">forward pass</text>
  <line x1="390" y1="1115" x2="450" y2="1115" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="460" y="1120" class="boxText">scope / optional / loss</text>
  <text x="720" y="1120" class="boxText">注：2D 高可信、3D 次可信；融合由可靠度门控决定。</text>
</svg>
