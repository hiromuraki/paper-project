<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1000" viewBox="0 0 1700 1000">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .boxTitle { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .boxText { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; }
      .small { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #64748b; }
      .formula { font: 500 16px "Cambria Math", "Times New Roman", serif; fill: #1e293b; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .flowBlue { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .flowGreen { fill: none; stroke: #16a34a; stroke-width: 2.2; marker-end: url(#arrowGreen); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1700" height="1000" fill="#ffffff"/>

  <text x="850" y="48" text-anchor="middle" class="title">
    轻量版骨骼二分类模型架构
  </text>
  <text x="850" y="78" text-anchor="middle" class="subtitle">
    输入 H36M 17 关节骨骼序列，输出动作是否良好（True / False）
  </text>

  <!-- Scope note -->
  <rect x="60" y="330" width="560" height="200" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="84" y="362" class="boxTitle">Scope / assumption</text>
  <text x="84" y="392" class="boxText">外部姿态模型负责骨骼提取；本模型不负责姿态估计。</text>
  <text x="84" y="420" class="boxText">输入为 H36M 17 关节 2D/3D 骨骼序列。</text>
  <text x="84" y="448" class="boxText">当前只做单个动作的 True / False 判定。</text>
  <text x="84" y="476" class="boxText">2D、3D 或两者同时输入；允许缺失一个模态。</text>
  <text x="84" y="506" class="small">骨骼序列仍可能过拟合受试者风格与机位，demo 阶段保留独立测试集即可。</text>

  <!-- Input -->
  <rect x="60" y="110" width="260" height="160" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="145" text-anchor="middle" class="boxTitle">Input</text>
  <text x="190" y="176" text-anchor="middle" class="boxText">x_2D: [B, T, 17, 2]</text>
  <text x="190" y="202" text-anchor="middle" class="boxText">x_3D: [B, T, 17, 3]</text>
  <text x="190" y="232" text-anchor="middle" class="small">可选：只给 2D 或只给 3D</text>

  <!-- Preprocessing -->
  <rect x="390" y="125" width="260" height="130" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="520" y="158" text-anchor="middle" class="boxTitle">Preprocessing</text>
  <text x="520" y="188" text-anchor="middle" class="boxText">root-center + scale</text>
  <text x="520" y="212" text-anchor="middle" class="boxText">resample to T frames</text>
  <text x="520" y="236" text-anchor="middle" class="boxText">coord + bone + velocity</text>

  <!-- 2D branch -->
  <rect x="720" y="70" width="400" height="220" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="920" y="102" text-anchor="middle" class="boxTitle">2D Branch</text>
  <text x="920" y="132" text-anchor="middle" class="boxText">Linear(6 → d) + joint embedding</text>
  <text x="920" y="160" text-anchor="middle" class="boxText">Spatial Transformer (17 joints)</text>
  <text x="920" y="188" text-anchor="middle" class="boxText">Temporal Transformer (T frames)</text>
  <text x="920" y="218" text-anchor="middle" class="boxText">mean + max pool</text>
  <text x="920" y="252" text-anchor="middle" class="formula">p_2D ∈ R^(2d)</text>

  <!-- 3D branch -->
  <rect x="720" y="330" width="400" height="220" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="920" y="362" text-anchor="middle" class="boxTitle">3D Branch</text>
  <text x="920" y="392" text-anchor="middle" class="boxText">Linear(9 → d) + joint embedding</text>
  <text x="920" y="420" text-anchor="middle" class="boxText">Spatial Transformer (17 joints)</text>
  <text x="920" y="448" text-anchor="middle" class="boxText">Temporal Transformer (T frames)</text>
  <text x="920" y="478" text-anchor="middle" class="boxText">mean + max pool</text>
  <text x="920" y="512" text-anchor="middle" class="formula">p_3D ∈ R^(2d)</text>

  <!-- Gated fusion -->
  <rect x="1180" y="185" width="270" height="240" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1315" y="220" text-anchor="middle" class="boxTitle">Gated Fusion</text>
  <text x="1315" y="254" text-anchor="middle" class="formula">α = σ(MLP([p_2D, p_3D]))</text>
  <text x="1315" y="288" text-anchor="middle" class="formula">h = α ⊙ p_2D</text>
  <text x="1315" y="316" text-anchor="middle" class="formula">+ (1 − α) ⊙ p_3D</text>
  <text x="1315" y="350" text-anchor="middle" class="small">缺失模态：只走存在的分支</text>
  <text x="1315" y="382" text-anchor="middle" class="small">可用模态 mask 控制 α</text>
  <text x="1315" y="410" text-anchor="middle" class="small">支持 modality dropout</text>

  <!-- Classification head -->
  <rect x="1500" y="215" width="150" height="190" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1575" y="248" text-anchor="middle" class="boxTitle">Head</text>
  <text x="1575" y="280" text-anchor="middle" class="boxText">MLP</text>
  <text x="1575" y="306" text-anchor="middle" class="boxText">d → d/2 → 1</text>
  <text x="1575" y="336" text-anchor="middle" class="boxText">logit</text>
  <text x="1575" y="364" text-anchor="middle" class="boxText">sigmoid</text>
  <text x="1575" y="390" text-anchor="middle" class="small">threshold 0.5</text>

  <!-- Output -->
  <rect x="1500" y="470" width="150" height="100" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="1575" y="503" text-anchor="middle" class="boxTitle">Output</text>
  <text x="1575" y="532" text-anchor="middle" class="boxText">prob ∈ [0, 1]</text>
  <text x="1575" y="556" text-anchor="middle" class="boxText">True / False</text>

  <!-- Training -->
  <rect x="720" y="620" width="730" height="120" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="1085" y="653" text-anchor="middle" class="boxTitle">Training</text>
  <text x="1085" y="683" text-anchor="middle" class="boxText">BCEWithLogitsLoss(pos_weight)</text>
  <text x="1085" y="708" text-anchor="middle" class="boxText">AdamW + cosine schedule</text>
  <text x="1085" y="730" text-anchor="middle" class="small">augment: mirror / scale / noise / modality dropout</text>

  <!-- Replaceable backbone -->
  <rect x="720" y="780" width="730" height="100" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="1085" y="813" text-anchor="middle" class="boxTitle">Replaceable backbone</text>
  <text x="1085" y="842" text-anchor="middle" class="boxText">ST-GCN / CTR-GCN / MotionBERT / PoseC3D</text>
  <text x="1085" y="866" text-anchor="middle" class="small">当前实现：轻量 factorized spatio-temporal Transformer</text>

  <!-- Arrows -->
  <path d="M320,190 L390,190" class="flow"/>
  <path d="M650,190 H686 V180 H720" class="flowBlue"/>
  <path d="M650,190 H686 V440 H720" class="flow"/>
  <path d="M1120,180 H1150 V270 H1180" class="flowBlue"/>
  <path d="M1120,440 H1150 V340 H1180" class="flow"/>
  <path d="M1450,305 H1500" class="flowGreen"/>
  <path d="M1575,405 V470" class="flowGreen"/>

  <!-- Dotted relation from training to model -->
  <path d="M1180,410 V620" class="dash"/>
  <path d="M1450,540 V620" class="dash"/>

  <!-- Legend -->
  <line x1="80" y1="900" x2="150" y2="900" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="165" y="905" class="boxText">forward</text>
  <line x1="300" y1="900" x2="370" y2="900" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="385" y="905" class="boxText">training / optional</text>
  <text x="640" y="905" class="boxText">注：当前模型是任务专用轻量结构，不是现成动作识别模型的直接套用。</text>
</svg>
